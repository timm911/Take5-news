<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Take5-AI News — fresh headlines across every section, refreshed every 5 minutes. When all you have is 5 mins.">
  <meta name="color-scheme" content="dark">
  <title>Take5-AI News — when all you have is 5 mins</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='monospace' font-size='40' font-weight='bold' fill='%2339ff14' text-anchor='middle'%3E5%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 class="site-title">TAKE5<span class="accent">-AI</span> NEWS</h1>
    <p class="tagline">when all you have is 5 mins</p>
    <p class="builtby">Built By: <span>Terror Ross</span></p>
    <div id="timer" class="timer" role="timer" aria-label="Time until next refresh">
      <span class="digit" id="m1">0</span><span class="digit" id="m2">5</span><span class="colon">:</span><span class="digit" id="s1">0</span><span class="digit" id="s2">0</span>
    </div>
    <p id="status" class="status">initializing…</p>
    <div class="refresh-ctl">
      <label for="cycle-select">NEWS REFRESH</label>
      <select id="cycle-select" aria-label="News refresh timing">
        <option value="2">2 MIN</option>
        <option value="5" selected>5 MIN</option>
        <option value="10">10 MIN</option>
        <option value="15">15 MIN</option>
        <option value="30">30 MIN</option>
      </select>
    </div>
  </header>

  <main id="grid" class="grid" aria-live="polite"></main>

  <footer>
    <p>Headlines via Google News, BBC, NPR, The Guardian, NYT, CNBC, The Verge, Ars Technica, TechCrunch, MIT Tech Review, Hacker News &amp; more · refreshed every 5 minutes · <a href="https://github.com/timm911/Take5-news" target="_blank" rel="noopener noreferrer">source</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
